name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow lz4

      - name: Install the package
        # Installing the package itself (not just its test dependencies) is what
        # makes the console script and the packaging metadata part of CI.
        run: python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest tests -q

      - name: Smoke-test the CLI
        run: |
          wepkg --version
          python -m wepkg --version
          python -m wepkg --help

      - name: Extract a synthetic package end to end
        run: python tools/smoke_test.py

  package:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
